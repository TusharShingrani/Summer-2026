name: deploy-infra

# CI/CD pipeline.
#
# Behaviour depends on whether AWS is connected (the AWS_ROLE_ARN repo variable):
#   - AWS_ROLE_ARN NOT set  -> runs terraform fmt/init/validate only (stays GREEN).
#                              This is the "you haven't connected AWS yet" state.
#   - AWS_ROLE_ARN set      -> also assumes the IAM role via OIDC and runs plan;
#                              on push to the default branch it runs apply.
#
# So a push here always produces a green "validated" run; wiring up AWS (see
# README "CI/CD setup") is what unlocks real plan/apply.

on:
  push:
    branches: [main, "claude/**"]
    paths: ["terraform/**", "cloud-init/**", ".github/workflows/deploy.yml"]
  pull_request:
    paths: ["terraform/**", "cloud-init/**"]
  workflow_dispatch:
    inputs:
      run_app_deploy:
        description: "Also run scripts/deploy.sh after apply"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write   # required for AWS OIDC
  pull-requests: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
  TF_IN_AUTOMATION: "true"

jobs:
  terraform:
    name: terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    outputs:
      elastic_ip: ${{ steps.tf_out.outputs.elastic_ip }}
    steps:
      - uses: actions/checkout@v4

      # Is AWS connected? Everything AWS-dependent keys off this flag so runs
      # without credentials stay green (validate-only) instead of failing.
      - name: check for AWS connection
        id: aws
        run: |
          if [ -n "${{ vars.AWS_ROLE_ARN }}" ]; then
            echo "connected=true" >> "$GITHUB_OUTPUT"
          else
            echo "connected=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWS_ROLE_ARN not set — running validate only. See README 'CI/CD setup' to enable plan/apply."
          fi

      - name: configure AWS credentials
        if: steps.aws.outputs.connected == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init
        run: terraform init -input=false

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        if: steps.aws.outputs.connected == 'true'
        run: terraform plan -input=false -out=tfplan

      # Apply on push to the default branch once AWS is connected.
      - name: terraform apply
        if: >-
          steps.aws.outputs.connected == 'true' &&
          github.event_name == 'push' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: terraform apply -input=false -auto-approve tfplan

      - name: capture outputs
        id: tf_out
        if: >-
          steps.aws.outputs.connected == 'true' &&
          github.event_name == 'push' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: echo "elastic_ip=$(terraform output -raw elastic_ip)" >> "$GITHUB_OUTPUT"

  app-deploy:
    name: app-deploy
    needs: terraform
    runs-on: ubuntu-latest
    # Only when explicitly requested via workflow_dispatch.
    if: github.event_name == 'workflow_dispatch' && inputs.run_app_deploy
    steps:
      - uses: actions/checkout@v4

      - name: write private key
        run: |
          install -d -m 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy.key
          chmod 600 ~/.ssh/deploy.key

      - name: run deploy script
        env:
          SSH_KEY_FILE: /home/runner/.ssh/deploy.key
          SSH_USER: ${{ vars.SSH_USER || 'admin' }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
        run: ./scripts/deploy.sh "${{ needs.terraform.outputs.elastic_ip }}"
